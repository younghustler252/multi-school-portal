name: CI
on:
  push:
    branches: [main, refactor/modules]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20                   # a hung test run must fail visibly, not sit for the 6 hour default
    services:
      redis:                              # some tests reach BullMQ; without Redis ioredis retries forever and `npm test` never exits
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # Regenerate the Prisma clients from the schemas so the typecheck below compares the code with the CURRENT schema,
      # then make sure the copies committed in the repo are the same (if this step fails: run `npm run prisma:generate -w apps/api` and commit apps/api/src/generated).
      - run: npm run prisma:generate -w apps/api
        env:
          PUBLIC_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          TENANT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Committed Prisma clients are up to date
        run: git diff --exit-code -- apps/api/src/generated
      - run: npm run typecheck -w apps/api
      - name: Diagnose per file (TEMPORARY)
        shell: bash
        working-directory: apps/api
        run: |
          mkdir -p /tmp/out; : > /tmp/summary.txt
          for f in $(find tests -name '*.test.ts' | sort); do
            timeout 100 npx tsx --import ./tests/setup/env.ts --test --test-reporter=spec "$f" > "/tmp/out/$(echo $f | tr / _).log" 2>&1 && rc=0 || rc=$?
            echo "$rc $f" >> /tmp/summary.txt
          done
          echo "=== SUMMARY (rc 0 pass, 1 fail, 124 hung)"; awk '{c[$1]++} END{for(k in c) print "rc="k": "c[k]}' /tmp/summary.txt
          echo "=== HUNG"; grep '^124 ' /tmp/summary.txt || true
          echo "=== FAILED"; grep '^1 ' /tmp/summary.txt || true
          for f in $(grep -E '^(1|124) ' /tmp/summary.txt | awk '{print $2}'); do
            echo "##### $f"; grep -E "^\s*(error:|✖|code:|message:|failureType|expected|actual)|Error:|AssertionError" "/tmp/out/$(echo $f | tr / _).log" | grep -v ECONNREFUSED | head -12 | cut -c1-240
          done

  web:
    runs-on: ubuntu-latest
    continue-on-error: true               # report only until the web app is brought up to date with the API; then remove this line
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # Tests first: they must stay green while the typecheck below is still red (a failing step stops the job).
      - run: npm run test -w apps/web
      - run: npm run typecheck -w apps/web
      - run: npm run lint -w apps/web
      - run: npm run build -w apps/web
        env:
          NEXT_PUBLIC_API_HOST: localhost:5000

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true               # report only for now; make it blocking once the baseline is clean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm audit --omit=dev --audit-level=high
