name: CI
on:
  push:
    branches: [main, refactor/modules]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # Regenerate the Prisma clients from the schemas so the typecheck below compares the code with the CURRENT schema,
      # then make sure the copies committed in the repo are the same (if this step fails: run `npm run prisma:generate -w apps/api` and commit apps/api/src/generated).
      - run: npm run prisma:generate -w apps/api
        env:
          PUBLIC_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          TENANT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Committed Prisma clients are up to date
        run: git diff --exit-code -- apps/api/src/generated
      - run: npm run typecheck -w apps/api
      - run: npm test -w apps/api          # database tests are skipped unless TEST_DATABASE_URL is set; read the skips

  web:
    runs-on: ubuntu-latest
    continue-on-error: true               # report only until the web app is brought up to date with the API; then remove this line
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run typecheck -w apps/web
      - run: npm run lint -w apps/web
      - run: npm run build -w apps/web
        env:
          NEXT_PUBLIC_API_HOST: localhost:5000

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true               # report only for now; make it blocking once the baseline is clean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm audit --omit=dev --audit-level=high
