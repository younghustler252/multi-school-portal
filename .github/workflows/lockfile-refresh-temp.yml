# TEMPORARY. Regenerates package-lock.json (the authoring sandbox has no npm registry access), proves swagger-jsdoc still builds the
# same spec on the upgraded glob/minimatch, and uploads the lockfile as an artifact. Deleted again before this PR is ready.
name: lockfile-refresh-temp
on:
  pull_request:
    paths: [".github/workflows/lockfile-refresh-temp.yml"]
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - uses: actions/checkout@v4
        with: { ref: refactor/api, path: base }
      - name: Baseline spec (refactor/api as it is today)
        run: |
          cat > /tmp/spec.cjs <<'JS'
          const sj = require(require.resolve("swagger-jsdoc", { paths: [process.cwd() + "/apps/api"] }));
          const s = sj({ definition: { openapi: "3.0.0", info: { title: "t", version: "1" } }, apis: ["./apps/api/src/modules/**/routes/*.routes.ts"] });
          console.log("PATHS", Object.keys(s.paths || {}).length, "glob", require("glob/package.json").version);
          JS
          cd base && npm ci && node /tmp/spec.cjs | tee /tmp/before.txt
      - name: Update lockfile for the new constraints
        shell: bash
        run: |
          set -eo pipefail
          npm update effect glob minimatch
          npm update mongoose -w apps/api
          npm install
          npm ls effect glob minimatch next mongoose eslint-config-next 2>&1 | grep -E "effect@|glob@|minimatch@|next@|mongoose@|eslint-config-next@" | sort -u | tee /tmp/versions.txt
          ! grep -q invalid /tmp/versions.txt
      - name: Spec on upgraded glob/minimatch must match baseline
        run: |
          node /tmp/spec.cjs | tee /tmp/after.txt
          test "$(sed 's/ glob.*//' /tmp/before.txt)" = "$(sed 's/ glob.*//' /tmp/after.txt)"
      - name: Production audit
        shell: bash
        run: npm audit --omit=dev --audit-level=high 2>&1 | tee /tmp/audit.txt
      - name: Prisma still generates identically
        run: |
          PUBLIC_DATABASE_URL=postgresql://ci:ci@localhost:5432/ci TENANT_DATABASE_URL=postgresql://ci:ci@localhost:5432/ci npm run prisma:generate -w apps/api
          git diff --stat -- apps/api/src/generated | tail -1
      - name: Print the lockfile change (the artifact host is unreachable from the authoring sandbox)
        if: always()
        run: |
          echo "LOCKDIFF-BEGIN"; git diff -- package-lock.json; echo "LOCKDIFF-END"
          git diff --stat -- package.json apps/*/package.json package-lock.json | tail -5
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lockfile
          path: |
            package-lock.json
            /tmp/before.txt
            /tmp/after.txt
            /tmp/versions.txt
            /tmp/audit.txt
